spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthcare}
spring.datasource.username=${DB_USER:healthcare_user}
spring.datasource.password=${DB_PASSWORD:healthcare_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Use H2 for tests by setting spring.profiles.active=test or override in CI
spring.application.name=health-care-system
spring.data.mongodb.database=${env.MONGO_DATABASE:}
spring.data.mongodb.uri=mongodb+srv://${env.MONGO_USER:}:${env.MONGO_PASS:}@${env.MONGO_CLUSTER:}

# Email Configuration
spring.mail.host=${env.MAIL_HOST:}
spring.mail.port=${env.MAIL_PORT:}
spring.mail.username=${env.MAIL_USERNAME:}
spring.mail.password=${env.MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Base URL
app.base.url=${env.BASE_URL:}

server.port=${env.PORT:8080}

# Session Configuration
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

