spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthcare}
spring.datasource.username=${DB_USER:healthcare_user}
spring.datasource.password=${DB_PASSWORD:healthcare_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Use H2 for tests by setting spring.profiles.active=test or override in CI
spring.application.name=health-care-system
spring.data.mongodb.database=${env.MONGO_DATABASE:}
spring.data.mongodb.uri=mongodb+srv://${env.MONGO_USER:}:${env.MONGO_PASS:}@${env.MONGO_CLUSTER:}

# Email Configuration
# Accept MAIL_* env keys directly, or env.MAIL_* (legacy), so your .env works as-is
spring.mail.host=${MAIL_HOST:${env.MAIL_HOST:}}
spring.mail.port=${MAIL_PORT:${env.MAIL_PORT:}}
spring.mail.username=${MAIL_USERNAME:${env.MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASS:${env.MAIL_PASS:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Base URL
app.base.url=${env.BASE_URL:}

server.port=${env.PORT:8080}

# Session Configuration
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

stripe.secretKey=${env.STRIPE_SECRET_KEY:}

# Notification provider configuration
# Prefer plain env var names (no 'env.' prefix). Use JVM env or system properties when running.
# Defaults:
#  - notifications.enabled: false (safety)
#  - notifications.sms.api.url / notifications.sms.api.key: empty by default
notifications.enabled=${NOTIFICATIONS_ENABLED:false}
# Map email-enabled flag to NOTIFICATIONS_ENABLED for backwards compatibility
notifications.email.enabled=${NOTIFICATIONS_ENABLED:false}
# WhatsApp Cloud API (example)
notifications.whatsapp.api.url=${WHATSAPP_API_URL:}
notifications.whatsapp.api.token=${WHATSAPP_API_TOKEN:}
# SMS provider (set to either the v1 or v3 send endpoint)
notifications.sms.api.url=${SMS_API_URL:}
notifications.sms.api.key=${SMS_API_KEY:}

# Enable hospital seeder (set to true to auto-create sample hospitals on startup)
app.seeder.hospitals.enabled=true