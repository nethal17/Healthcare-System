spring.application.name=health-care-system
spring.data.mongodb.database=${env.MONGO_DATABASE}
spring.data.mongodb.uri=mongodb+srv://${env.MONGO_USER}:${env.MONGO_PASS}@${env.MONGO_CLUSTER}

# Email Configuration
spring.mail.host=${env.MAIL_HOST}
spring.mail.port=${env.MAIL_PORT}
spring.mail.username=${env.MAIL_USERNAME}
spring.mail.password=${env.MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Base URL
app.base.url=${env.BASE_URL}

server.port=${env.PORT}

# Session Configuration
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

stripe.secretKey=${env.STRIPE_SECRET_KEY}
# Appointment Configuration
appointment.working.start=09:00
appointment.working.end=17:00
appointment.lunch.start=13:00
appointment.lunch.end=14:00
appointment.slot.duration=30
appointment.booking.advance.hours=1
appointment.booking.days.ahead=7
appointment.reservation.timeout.minutes=15

# Payment Configuration
payment.consultation.fee=2500.00
payment.currency=LKR
payment.stripe.success.url=${app.base.url}/appointments/payment/success
payment.stripe.cancel.url=${app.base.url}/appointments/payment/cancel
